<!DOCTYPE html>
<html lang="ca" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervally - Entrenament d'Intervals Musicals</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- VexFlow Library -->
    <script src="app.js?v=2.0"></script>

    <style>
        .timer-display {
            font-variant-numeric: tabular-nums;
        }
        #stave-display svg {
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-full flex flex-col justify-between">

    <!-- HEADER (Nivell / Títol principal) -->
    <header id="main-header" class="w-full max-w-2xl mx-auto px-4 pt-6 text-center">
        <h1 class="text-3xl font-extrabold text-blue-400">Intervally</h1>
        <p class="text-gray-400 text-sm mt-1">Aprendre a llegir intervals a la partitura</p>
    </header>

    <!-- PANTALLA D'INICI (Selecció de Nivells) -->
    <section id="start-screen" class="max-w-md w-full mx-auto px-4 my-auto">
        <div class="bg-gray-800 rounded-xl p-6 shadow-xl border border-gray-700 text-center">
            <h2 class="text-2xl font-bold mb-4 text-white">Tria un Nivell</h2>
            <div class="space-y-3">
                <button onclick="IntervallyApp.startGame('inicial')"
                        class="w-full py-3 px-4 bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition border border-green-500 shadow-md">
                    Nivell 1: Inicial
                    <span class="block text-xs font-normal text-green-200 mt-0.5">
                        Ascendent | Intervals Majors i Justos
                    </span>
                </button>

                <button onclick="IntervallyApp.startGame('intermedio')"
                        class="w-full py-3 px-4 bg-yellow-600 hover:bg-yellow-500 text-white font-bold rounded-lg transition border border-yellow-500 shadow-md">
                    Nivell 2: Intermedi
                    <span class="block text-xs font-normal text-yellow-200 mt-0.5">
                        Ascendent i Descendent | Intervals Majors i Justos
                    </span>
                </button>

                <button onclick="IntervallyApp.startGame('dificil')"
                        class="w-full py-3 px-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-lg transition border border-red-500 shadow-md">
                    Nivell 3: Difícil
                    <span class="block text-xs font-normal text-red-200 mt-0.5">
                        Ascendent i Descendent | Tots els Intervals (Cromàtic)
                    </span>
                </button>
            </div>
        </div>
    </section>

    <!-- PANTALLA DE JOC -->
    <section id="game-screen" class="max-w-xl w-full mx-auto px-4 my-auto hidden">
        <!-- Marcador i Temporitzador -->
        <div class="flex justify-between items-center mb-3 bg-gray-800 px-4 py-2 rounded-lg border border-gray-700">
            <div>
                <span class="text-xs text-gray-400 block">Nivell</span>
                <span id="current-difficulty" class="font-bold text-blue-400 text-sm">--</span>
            </div>
            <div class="text-center">
                <span class="text-xs text-gray-400 block">Temps</span>
                <span id="timer-display" class="timer-display font-mono font-bold text-lg text-green-400">30</span>
            </div>
            <div class="text-right">
                <span class="text-xs text-gray-400 block">Encerts</span>
                <span class="font-bold text-sm"><span id="score-correct" class="text-green-400">0</span> / <span id="score-total">0</span></span>
            </div>
        </div>

        <!-- Pentagrama Renderitzat amb VexFlow -->
        <div id="stave-container" class="bg-white rounded-xl p-3 shadow-lg mb-4 text-gray-900 border border-gray-200 min-h-[140px] flex items-center justify-center">
            <div id="stave-display" class="w-full"></div>
        </div>

        <!-- Selecció de Direcció (Ascendent / Descendent) -->
        <div class="flex justify-center gap-3 mb-4">
            <button id="btn-ascendente" onclick="IntervallyApp.selectDirection('ascendente')"
                    class="flex-1 py-2 px-3 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition">
                Ascendent ↑
            </button>
            <button id="btn-descendente" onclick="IntervallyApp.selectDirection('descendente')"
                    class="flex-1 py-2 px-3 rounded-lg bg-gray-700 hover:bg-gray-600 text-white font-semibold text-sm transition">
                Descendent ↓
            </button>
        </div>

        <!-- Botons de Tria d'Intervals -->
        <div id="interval-buttons-container" class="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-4">
            <!-- Es generen dinàmicament des de JS -->
        </div>

        <!-- Mensatge de Feedback -->
        <div id="feedback-message" class="text-center h-8 font-bold text-base mb-2"></div>

        <!-- Botons d'Acció (Comprovar / Següent) -->
        <div class="flex gap-3">
            <button id="btn-check" onclick="IntervallyApp.checkAnswer()" disabled
                    class="flex-1 py-3 bg-blue-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-blue-500 text-white font-bold rounded-lg transition shadow-md">
                Comprovar
            </button>
            <button id="btn-next" onclick="IntervallyApp.nextInterval()" disabled
                    class="flex-1 py-3 bg-gray-700 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-gray-600 text-white font-bold rounded-lg transition shadow-md">
                Següent
            </button>
        </div>

        <!-- Tornar al menú -->
        <div class="text-center mt-4">
            <button onclick="IntervallyApp.returnToMenu()" class="text-xs text-gray-400 hover:text-white underline">
                ← Tornar al menú principal
            </button>
        </div>
    </section>

    <!-- FOOTER -->
    <footer id="main-footer" class="w-full text-center py-4 text-xs text-gray-500">
        Intervally App &copy; Entrenament de lectura musical - Eugeni Corchero
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
