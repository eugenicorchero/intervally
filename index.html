<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervally - Entrenador Visual d'Intervals Musicals</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- VexFlow CDN (Versió Estable 3.0.9) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/3.0.9/vexflow-min.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --stave-bg: #1e293b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .stave-wrapper {
            background-color: var(--stave-bg);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.4), 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-radius: 1rem;
        }

        .btn-interval {
            min-height: 2.8rem;
            font-weight: 600;
            border-radius: 0.75rem;
            background-color: #1f2937;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e5e7eb;
            transition: all 0.15s ease;
        }

        .btn-interval:hover:not(:disabled) {
            background-color: #374151;
            border-color: #3b82f6;
        }

        .btn-interval.selected {
            background-color: #2563eb !important;
            border-color: #60a5fa !important;
            color: #ffffff !important;
        }

        #stave-display svg {
            margin: 0 auto;
        }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col justify-between">

    <div class="w-full max-w-4xl mx-auto flex-1 flex flex-col">

        <!-- Header -->
        <header id="main-header" class="text-center mb-6">
            <div class="inline-flex items-center gap-2">
                <span class="text-3xl">🎼</span>
                <h1 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-400">
                    Intervally
                </h1>
            </div>
            <p class="text-gray-400 text-xs sm:text-sm mt-1">Entrenador Visual d'Intervals Musicals</p>
        </header>

        <!-- PANTALLA D'INICI -->
        <section id="start-screen" class="bg-gray-800/60 backdrop-blur-md p-6 sm:p-8 rounded-2xl border border-gray-700/50 shadow-2xl text-center my-auto">
            <h2 class="text-2xl font-bold mb-2 text-white">Tria el teu Nivell de Pràctica</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 max-w-2xl mx-auto mt-6">
                <button onclick="IntervallyApp.startGame('inicial')" class="p-5 bg-gray-900 border border-blue-500/30 hover:border-blue-500 rounded-xl text-left">
                    <span class="font-bold text-lg text-blue-400">Inicial</span>
                    <p class="text-xs text-gray-400 mt-1">(Intervals bàsics)</p>
                </button>
                <button onclick="IntervallyApp.startGame('intermedio')" class="p-5 bg-gray-900 border border-indigo-500/30 hover:border-indigo-500 rounded-xl text-left">
                    <span class="font-bold text-lg text-indigo-400">Intermedi</span>
                    <p class="text-xs text-gray-400 mt-1">(Tots els intervals)</p>
                </button>
                <button onclick="IntervallyApp.startGame('dificil')" class="p-5 bg-gray-900 border border-purple-500/30 hover:border-purple-500 rounded-xl text-left">
                    <span class="font-bold text-lg text-purple-400">Difícil</span>
                    <p class="text-xs text-gray-400 mt-1">(Ascendent / Descendent)</p>
                </button>
            </div>
        </section>

        <!-- PANTALLA DE JOC -->
        <section id="game-screen" class="hidden flex-1 flex flex-col justify-between gap-4">
            
            <div class="flex items-center justify-between bg-gray-800/80 px-4 py-2.5 rounded-xl text-sm">
                <button onclick="IntervallyApp.returnToMenu()" class="text-gray-400 hover:text-white text-xs sm:text-sm">← Menú</button>
                <div class="text-xs sm:text-sm text-gray-400">
                    Dificultat: <span id="current-difficulty" class="font-semibold text-blue-400 capitalize"></span>
                </div>
                <div class="text-xs sm:text-sm text-gray-400">
                    Puntuació: <span id="score-correct" class="font-bold text-green-400">0</span>/<span id="score-total" class="font-bold text-gray-200">0</span>
                </div>
            </div>

            <!-- VISUALITZADOR DE PARTITURA -->
            <div class="stave-wrapper p-4 flex flex-col items-center justify-center min-h-[180px] relative" id="stave-wrapper">
                <div id="stave-display" class="w-full flex justify-center items-center"></div>
            </div>

            <!-- BOTONS -->
            <div class="space-y-4">
                <div id="interval-buttons-container" class="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-2"></div>
                <div id="feedback-message" class="text-center min-h-[24px] font-semibold text-sm"></div>
                <div class="flex gap-3">
                    <button id="btn-check" onclick="IntervallyApp.checkAnswer()" disabled class="flex-1 py-3 px-4 rounded-xl font-bold text-sm bg-blue-600 disabled:bg-gray-800 text-white">Comprova</button>
                    <button id="btn-next" onclick="IntervallyApp.nextInterval()" disabled class="flex-1 py-3 px-4 rounded-xl font-bold text-sm bg-gray-700 disabled:opacity-40 text-white">Següent</button>
                </div>
            </div>

        </section>

    </div>

    <script>
        const IntervallyApp = (function() {
            let score = { correct: 0, total: 0 };
            let selectedInterval = null;
            let currentExercise = { note1: "c/4", note2: "g/4", type: '5P' };

            const allIntervals = [
                { id: '1P', name: 'Uníson' },
                { id: '2m', name: '2ª menor' },
                { id: '2M', name: '2ª Major' },
                { id: '3m', name: '3ª menor' },
                { id: '3M', name: '3ª Major' },
                { id: '4P', name: '4ª Justa' },
                { id: '5P', name: '5ª Justa' },
                { id: '8P', name: '8ª Justa' }
            ];

            function init() {
                renderButtons();
            }

            function renderButtons() {
                const container = document.getElementById('interval-buttons-container');
                container.innerHTML = '';
                allIntervals.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-interval text-xs sm:text-sm';
                    btn.innerText = item.name;
                    btn.onclick = () => {
                        selectedInterval = item.id;
                        document.querySelectorAll('.btn-interval').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                        document.getElementById('btn-check').disabled = false;
                    };
                    container.appendChild(btn);
                });
            }

            function startGame(difficulty) {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-screen').classList.remove('hidden');
                document.getElementById('current-difficulty').innerText = difficulty;
                nextInterval();
            }

            function nextInterval() {
                document.getElementById('feedback-message').innerText = '';
                document.getElementById('btn-check').disabled = true;
                document.getElementById('btn-next').disabled = true;
                document.querySelectorAll('.btn-interval').forEach(b => b.classList.remove('selected'));
                
                // Renderitzar la partitura directament
                renderStaveOriginal();
            }

            // MÈTODE ORIGINAL RESTRUCTURAT I SENSE ERRORS
            function renderStaveOriginal() {
                const container = document.getElementById('stave-display');
                container.innerHTML = '';

                if (typeof Vex === 'undefined') {
                    console.error("VexFlow no carregat");
                    return;
                }

                const VF = Vex.Flow;
                const renderer = new VF.Renderer(container, VF.Renderer.Backends.SVG);
                renderer.resize(250, 130);
                const context = renderer.getContext();

                // Estil clar per al fons fosc
                context.setFillStyle("#f3f4f6");
                context.setStrokeStyle("#f3f4f6");

                const stave = new VF.Stave(10, 10, 230);
                stave.addClef("treble");
                stave.setContext(context).draw();

                // Dibuix directe de les dues notes del pentagrama
                const notes = [
                    new VF.StaveNote({ keys: [currentExercise.note1], duration: "h" }),
                    new VF.StaveNote({ keys: [currentExercise.note2], duration: "h" })
                ];

                // Aplicar estil blanc a les notes
                notes.forEach(note => {
                    note.setStyle({ fillStyle: "#f3f4f6", strokeStyle: "#f3f4f6" });
                });

                const voice = new VF.Voice({ num_beats: 4, beat_value: 4 });
                voice.addTickables(notes);

                const formatter = new VF.Formatter().joinVoices([voice]);
                formatter.format([voice], 130);

                voice.draw(context, stave);
            }

            function checkAnswer() {
                score.total++;
                const feedback = document.getElementById('feedback-message');
                if (selectedInterval === currentExercise.type) {
                    score.correct++;
                    feedback.innerText = "✨ Correcte!";
                    feedback.className = "text-center min-h-[24px] font-bold text-sm text-green-400";
                } else {
                    feedback.innerText = "❌ Incorrecte!";
                    feedback.className = "text-center min-h-[24px] font-bold text-sm text-red-400";
                }
                document.getElementById('score-correct').innerText = score.correct;
                document.getElementById('score-total').innerText = score.total;
                document.getElementById('btn-check').disabled = true;
                document.getElementById('btn-next').disabled = false;
            }

            function returnToMenu() {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('start-screen').classList.remove('hidden');
            }

            window.addEventListener('DOMContentLoaded', init);

            return { startGame, checkAnswer, nextInterval, returnToMenu };
        })();
    </script>
</body>
</html>
